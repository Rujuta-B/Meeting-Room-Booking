# web/nginx.conf
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # WHY this fallback is needed: React Router handles routes like
    # /my-bookings or /admin/rooms entirely CLIENT-SIDE - there is no real
    # file at those paths on disk. Without this rule, nginx's default
    # behavior is to look for a literal file at the requested path and
    # return a 404 when it doesn't exist - which happens on every hard
    # refresh of any route except "/". `try_files` falls back to serving
    # index.html for any path nginx can't match to a real file, letting
    # the React app boot and its own router take over from there.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
