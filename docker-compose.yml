# docker-compose.yml (repo root)
#
# One command brings up the entire stack: Postgres, the Express API, and
# the React frontend. `docker compose up --build` (see web/'s section
# below for why --build matters) is the whole setup, beyond copying the
# two .env.example files - matching the spec's "no manual setup beyond a
# documented .env" requirement, extended to cover the frontend too.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      # pg_isready checks Postgres is actually accepting connections, not
      # just that the container process has started - `api` waits on this
      # (via depends_on: condition: service_healthy below) so it never
      # tries to run migrations against a database that isn't ready yet.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    env_file: ./api/.env
    ports:
      - '3000:3000'

  web:
    build:
      context: ./web
      args:
        # Vite inlines VITE_* variables into the compiled JS bundle at
        # BUILD time, not read at container startup - so the API URL has
        # to be passed as a build ARG here, not just an env_file entry.
        # Practical consequence: after changing this value (or api/.env's
        # WEB_ORIGIN), you must run `docker compose up --build`, not just
        # `docker compose up`, or the frontend keeps calling whatever URL
        # was baked into the last built image.
        VITE_API_URL: http://localhost:3000
    depends_on:
      - api
    ports:
      - '5173:80'

volumes:
  pgdata:
